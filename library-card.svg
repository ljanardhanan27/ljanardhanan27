<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1545"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="band" x1="0" x2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <clipPath id="clip"><rect width="700" height="310" rx="16"/></clipPath>
    <style>
      .m{font-family:'JetBrains Mono',Consolas,'Liberation Mono',monospace}
      .l{font-size:12px;letter-spacing:2px;fill:#a78bfa}
      .v{font-size:16px;fill:#e0e7ff;font-family:Georgia,'Times New Roman',serif;font-style:italic}
      .r{stroke:#312e81;stroke-dasharray:2 5}
      .f{fill:#e0e7ff;animation:fall linear infinite}
      @keyframes fall{from{transform:translate(0,-10px)}50%{transform:translate(8px,150px)}to{transform:translate(0,320px)}}
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="700" height="310" fill="url(#bg)"/>
    <rect width="700" height="58" fill="url(#band)"/>
    <text class="m" x="350" y="37" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="6" fill="#ede9fe">✦ LIBRARY CARD ✦</text>

    <text class="m l" x="36" y="96">BORROWER</text>
    <text class="v" x="230" y="96">Lochana</text>
    <line class="r" x1="36" x2="664" y1="110" y2="110"/>

    <text class="m l" x="36" y="140">CHECKED OUT</text>
    <text class="v" x="230" y="140">Blood of Hercules · The Way of Shadows</text>
    <text class="v" x="230" y="162">The Lean Startup · The Midnight Library</text>
    <line class="r" x1="36" x2="664" y1="176" y2="176"/>

    <text class="m l" x="36" y="204">FAVORITE SHELF</text>
    <text class="v" x="230" y="204">Throne of Glass · Once Upon a Broken Heart</text>
    <line class="r" x1="36" x2="664" y1="218" y2="218"/>

    <text class="m l" x="36" y="244">OVERDUE</text>
    <text class="v" x="230" y="244">my entire reading list</text>
    <line class="r" x1="36" x2="664" y1="258" y2="258"/>

    <text class="m l" x="36" y="284">FUEL</text>
    <text class="v" x="230" y="284">an iced latte, or a warm hot chocolate</text>

    <circle class="f" cx="60" r="2" opacity=".5" style="animation-duration:8s;animation-delay:-2s"/>
    <circle class="f" cx="190" r="1.5" opacity=".4" style="animation-duration:10s;animation-delay:-6s"/>
    <circle class="f" cx="330" r="2.5" opacity=".5" style="animation-duration:7s;animation-delay:-4s"/>
    <circle class="f" cx="470" r="1.5" opacity=".4" style="animation-duration:9s;animation-delay:-1s"/>
    <circle class="f" cx="590" r="2" opacity=".5" style="animation-duration:8s;animation-delay:-5s"/>
    <circle class="f" cx="660" r="2.5" opacity=".5" style="animation-duration:11s;animation-delay:-8s"/>
  </g>
  <rect x="1" y="1" width="698" height="308" rx="16" fill="none" stroke="#6d28d9" stroke-width="2"/>
</svg>
